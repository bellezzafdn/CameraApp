name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          xcodebuild \
            -project Fotocamera.xcodeproj \
            -scheme Fotocamera \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log | xcpretty || true
          
          echo "=== Build exit code: ${PIPESTATUS[0]} ==="

      - name: Package and Sign IPA
        run: |
          echo "=== Searching for .app bundle in Release-iphoneos ==="
          ls -la build/Build/Products/Release-iphoneos/
          
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          
          echo "=== Setting executable permissions ==="
          chmod +x Payload/*.app/*
          
          echo "=== Ad-hoc signing ==="
          codesign --force --deep --sign - Payload/*.app
          
          echo "=== Creating Fotocamera.ipa ==="
          zip -r Fotocamera.ipa Payload
          ls -la Fotocamera.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fotocamera-IPA
          path: Fotocamera.ipa
