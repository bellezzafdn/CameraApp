name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          xcodebuild \
            -project CameraApp.xcodeproj \
            -scheme CameraApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log | xcpretty || true
          
          echo "=== Build exit code: ${PIPESTATUS[0]} ==="

      - name: Package IPA
        run: |
          echo "=== Searching for .app bundle ==="
          find build -name "*.app" -type d
          
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Trying alternative path..."
            APP_PATH=$(find build -name "*.app" -type d | head -1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found. Full build directory:"
            find build -type f | head -100
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          echo "App contents:"
          ls -la "$APP_PATH"
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CameraApp.ipa Payload
          echo "=== IPA created ==="
          ls -la CameraApp.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-IPA
          path: CameraApp.ipa
