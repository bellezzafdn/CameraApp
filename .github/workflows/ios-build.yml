name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          PROJECT_FILE=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          echo "Found project: $PROJECT_FILE"
          
          SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_FILE" | awk '/Schemes:/{flag=1;next} flag{gsub(/^[ \t]+|[ \t]+$/, ""); if(NF) {print; exit}}')
          echo "Found scheme: $SCHEME_NAME"
          
          xcodebuild \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log

      - name: Verify build output
        run: |
          echo "=== Searching for built app ==="
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          echo "App bundle path: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app directory found!"
            exit 1
          fi
          
          APP_NAME=$(basename "$APP_PATH" .app)
          echo "App name: $APP_NAME"
          echo "Contents of $APP_PATH:"
          ls -la "$APP_PATH"
          
          if [ ! -f "$APP_PATH/$APP_NAME" ]; then
            echo "ERROR: Executable '$APP_NAME' NOT found in $APP_PATH!"
            echo "--- Last 50 lines of build log ---"
            tail -n 50 build.log
            exit 1
          fi
          
          echo "=== Executable found! ==="
          file "$APP_PATH/$APP_NAME"

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          APP_NAME=$(basename "$APP_PATH" .app)
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "${APP_NAME}.ipa" Payload
          ls -lh "${APP_NAME}.ipa"
          cp "${APP_NAME}.ipa" CameraApp.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-IPA
          path: CameraApp.ipa
