name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          xcodebuild \
            -project CameraApp.xcodeproj \
            -scheme CameraApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ${{ github.workspace }}/build/CameraApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            archive | xcpretty || true

      - name: Find and package IPA
        run: |
          echo "=== Archive contents ==="
          find ${{ github.workspace }}/build/CameraApp.xcarchive -name "*.app" -type d
          
          APP_PATH=$(find ${{ github.workspace }}/build/CameraApp.xcarchive -name "*.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found in archive!"
            echo "Full archive structure:"
            find ${{ github.workspace }}/build/CameraApp.xcarchive -type f | head -50
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CameraApp.ipa Payload
          ls -la CameraApp.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-IPA
          path: CameraApp.ipa
