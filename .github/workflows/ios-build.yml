name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          xcodebuild \
            -project CameraApp.xcodeproj \
            -scheme CameraApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ${{ github.workspace }}/build/CameraApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            archive | xcpretty || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ${{ github.workspace }}/build/CameraApp.xcarchive/Products/Applications/CameraApp.app Payload/
          zip -r CameraApp.ipa Payload
          ls -la CameraApp.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-IPA
          path: CameraApp.ipa
