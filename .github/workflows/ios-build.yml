name: iOS Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: macos-latest               # macOS con Xcode pre‑installato
    env:
      PROJECT_NAME: CameraApp
      SCHEME: CameraApp
      EXPORT_METHOD: ad-hoc            # cambia in "development" o "app-store" se necessario

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Se non hai già un .xcodeproj, XcodeGen lo creerà da un file project.yml (facoltativo)
      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project (optional)
        # Salva un file `project.yml` nella radice se vuoi generare il progetto.
        # Se già hai un .xcodeproj, questo step può essere rimosso.
        run: |
          if [ -f project.yml ]; then xcodegen generate; fi

      - name: Build and archive
        run: |
          xcodebuild \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$PWD/build/$SCHEME.xcarchive" \
            clean archive

      - name: Export IPA
        run: |
          # ExportOptions.plist deve esistere nella radice (vedi sotto)
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/$SCHEME.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$PWD/build"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp.ipa
          path: build/*.ipa
