name: Fotocamera
options:
  bundleIdPrefix: com.bellezzafdn
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  Fotocamera:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: group
    resources:
      - path: Resources
        type: group
        optional: true
    info:
      path: Info.plist
      properties:
        CFBundleName: Fotocamera
        CFBundleDisplayName: Fotocamera
        CFBundleIdentifier: com.bellezzafdn.Fotocamera
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        UILaunchStoryboardName: ""
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Fotocamera ha bisogno dell'accesso alla fotocamera per applicare i filtri AR"
        NSPhotoLibraryUsageDescription: "Fotocamera ha bisogno dell'accesso alle foto per salvare le immagini"
        NSMotionUsageDescription: "Fotocamera usa i dati di movimento per rilevare lo scuotimento"
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.bellezzafdn.Fotocamera
        PRODUCT_NAME: Fotocamera
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - sdk: ARKit.framework
      - sdk: Vision.framework
      - sdk: CoreMotion.framework
      - sdk: AVFoundation.framework
