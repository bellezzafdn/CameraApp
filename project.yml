name: CameraApp
options:
  bundleIdPrefix: com.bellezzafdn
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  CameraApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: group
    resources:
      - path: Resources
        type: group
        optional: true
    info:
      path: Info.plist
      properties:
        CFBundleName: CameraApp
        CFBundleDisplayName: Camera Magic
        CFBundleIdentifier: com.bellezzafdn.CameraApp
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: CameraApp
        UILaunchStoryboardName: ""
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Camera Magic needs camera access to apply AR filters"
        NSPhotoLibraryUsageDescription: "Camera Magic needs photo library access to save photos"
        NSMotionUsageDescription: "Camera Magic uses motion data for shake detection"
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.bellezzafdn.CameraApp
        PRODUCT_NAME: CameraApp
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - sdk: ARKit.framework
      - sdk: Vision.framework
      - sdk: CoreMotion.framework
      - sdk: AVFoundation.framework
